# nginx: serves the built SPA and reverse-proxies API traffic so the
# httpOnly refresh cookie stays same-origin (no CORS/SameSite gymnastics).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # ---- API ---------------------------------------------------------------
  location /api/ {
    proxy_pass http://api:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    client_max_body_size 8m;   # matches MAX_UPLOAD_MB + overhead
  }

  location /uploads/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1d;
  }

  location = /health {
    proxy_pass http://api:5000;
    access_log off;
  }

  location = /ready {
    proxy_pass http://api:5000;
    access_log off;
  }

  location /api-docs/ {
    proxy_pass http://api:5000;
    proxy_set_header Host $host;
  }

  # ---- PWA ---------------------------------------------------------------
  # The service worker and manifest must never be cached, or a new deploy
  # is not noticed ("New update available" relies on a fresh sw.js).
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # ---- SPA ---------------------------------------------------------------
  location / {
    try_files $uri $uri/ /index.html;
  }
}
