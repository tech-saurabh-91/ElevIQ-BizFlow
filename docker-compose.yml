# ElevIQ SFA - full stack (API + web) behind a single origin.
#
#   1. cp .env.example .env   and fill in MONGO_URI / JWT secrets
#   2. docker compose up --build
#   3. open http://localhost:8080  (web)  -  API docs at /api-docs
#
# The web container is nginx: it serves the built SPA and proxies /api to the
# API container, so cookies stay same-origin in production.

name: eleviq-sfa

services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Same-origin via the nginx proxy in front of both containers.
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}   # true when serving over HTTPS
    ports:
      - "5000:5000"   # optional direct access; remove to expose only nginx
    volumes:
      - uploads-data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  uploads-data:
